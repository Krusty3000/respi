<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohérence Cardiaque</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Cohérence Cardiaque</h1>
      <p class="subtitle">Respirez en rythme, apaisez votre esprit</p>
    </header>

    <main>
      <div class="breath-stage">
        <div class="circle" id="circle">
          <span class="phase-text" id="phaseText">Prêt</span>
          <span class="cycle-count" id="cycleCount"></span>
        </div>
      </div>

      <div class="timer-row">
        <div class="time-block">
          <span class="time-label">Temps restant</span>
          <span class="time-value" id="timeRemaining">05:00</span>
        </div>
        <div class="time-block">
          <span class="time-label">Cycles</span>
          <span class="time-value" id="cyclesValue">0 / 0</span>
        </div>
      </div>

      <section class="controls">
        <div class="control-group">
          <label for="preset">Préréglage</label>
          <select id="preset">
            <option value="365">365 — 5s inspire / 5s expire</option>
            <option value="46">Relaxation — 4s inspire / 6s expire</option>
            <option value="478">4-7-8 — 4s inspire / 7s pause / 8s expire</option>
            <option value="custom">Personnalisé</option>
          </select>
        </div>

        <div class="control-group custom-fields" id="customFields">
          <div class="field">
            <label for="inhale">Inspiration (s)</label>
            <input type="number" id="inhale" min="1" max="20" value="5">
          </div>
          <div class="field">
            <label for="hold">Pause après inspiration (s)</label>
            <input type="number" id="hold" min="0" max="20" value="0">
          </div>
          <div class="field">
            <label for="exhale">Expiration (s)</label>
            <input type="number" id="exhale" min="1" max="20" value="5">
          </div>
          <div class="field">
            <label for="hold2">Pause après expiration (s)</label>
            <input type="number" id="hold2" min="0" max="20" value="0">
          </div>
        </div>

        <div class="control-group">
          <label for="duration">Durée de la séance (minutes)</label>
          <input type="number" id="duration" min="1" max="60" step="1" value="5">
        </div>

        <div class="control-group toggle-group">
          <label class="switch">
            <input type="checkbox" id="soundToggle" checked>
            <span class="slider-toggle"></span>
          </label>
          <span>Son</span>
        </div>
      </section>

      <div class="buttons">
        <button id="startBtn" class="btn primary">Commencer</button>
        <button id="pauseBtn" class="btn" disabled>Pause</button>
        <button id="resetBtn" class="btn" disabled>Réinitialiser</button>
      </div>
    </main>

    <footer>
      <p>La cohérence cardiaque consiste à respirer à environ 6 cycles par minute pour réguler le système nerveux autonome.</p>
      <p class="version">Version 6</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
